    {
      "id": "app.path_access_request",
      "kind": "entity",
      "version": 1,
      "description": "Exact request to expand workspace access; denial and silence do not grant access.",
      "fields": [
        {
          "name": "attempt_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "workspace_generation",
          "type": {
            "ref": "app.counter"
          },
          "required": true
        },
        {
          "name": "id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "job_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "workspace_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "path_ref",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "access",
          "type": {
            "ref": "app.access_mode"
          },
          "required": true
        },
        {
          "name": "request_digest",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "state",
          "type": {
            "ref": "app.decision_state"
          },
          "required": true
        },
        {
          "name": "expires_at",
          "type": {
            "ref": "app.timestamp"
          },
          "required": true
        }
      ],
      "identity": [
        "id"
      ]
    },
    {
      "id": "app.execution_event",
      "kind": "entity",
      "version": 1,
      "description": "Durable ordered projection, excluding provider credentials and hidden reasoning.",
      "fields": [
        {
          "name": "attempt_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "job_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "cursor",
          "type": {
            "ref": "app.counter"
          },
          "required": true
        },
        {
          "name": "kind",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "payload_ref",
          "type": {
            "optional": {
              "ref": "app.text"
            }
          }
        }
      ],
      "identity": [
        "id"
      ]
    },
    {
      "version": 1,
      "id": "app.question_state",
      "kind": "enum",
      "values": [
        {
          "value": "pending"
        },
        {
          "value": "answered"
        },
        {
          "value": "denied"
        },
        {
          "value": "expired"
        },
        {
          "value": "superseded"
        }
      ]
    },
    {
      "version": 1,
      "id": "app.attention_request",
      "kind": "entity",
      "description": "A persisted typed Pi question; answer is bound to the exact attempt, digest, expiry and workspace generation.",
      "fields": [
        {
          "name": "id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "job_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "attempt_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "session_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "client_id",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "method",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "request_digest",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "state",
          "type": {
            "ref": "app.question_state"
          },
          "required": true
        },
        {
          "name": "expires_at",
          "type": {
            "ref": "app.timestamp"
          },
          "required": true
        }
      ],
      "identity": [
        "id"
      ]
    },
    {
      "version": 1,
      "id": "app.path_grant",
      "kind": "entity",
      "description": "Owner-approved canonical path, read/write mode and one-hour session scope. Old writers stop before a new explicit turn applies the mount.",
      "fields": [
        {
          "name": "id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "session_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "workspace_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "origin_attempt_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "canonical_path",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "access",
          "type": {
            "ref": "app.access_mode"
          },
          "required": true
        },
        {
          "name": "target",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "expires_at",
          "type": {
            "ref": "app.timestamp"
          },
          "required": true
        }
      ],
      "identity": [
        "id"
      ]
    },
    {
      "version": 1,
      "id": "app.sandbox_receipt",
      "kind": "entity",
      "description": "Checked pinned Docker image, exact mount targets/modes, non-root/read-only/capability/resource policy; saved with the job before prompt dispatch. Does not promise egress allowlisting, hard disk quotas or private internal paths.",
      "fields": [
        {
          "name": "id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "session_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "workspace_id",
          "type": {
            "ref": "app.id"
          },
          "required": true
        },
        {
          "name": "image_id",
          "type": {
            "ref": "app.text"
          },
          "required": true
        },
        {
          "name": "workspace_generation",
          "type": {
            "ref": "app.counter"
          },
          "required": true
        },
        {
          "name": "checked_at",
          "type": {
            "ref": "app.timestamp"
          },
          "required": true
        }
      ],
      "identity": [
        "id"
      ]
    },
    {
      "id": "app.counter",
      "kind": "scalar",
      "version": 1,
      "base": "number",
      "description": "Non-negative generation or durable event cursor."
    }
  ]
}
